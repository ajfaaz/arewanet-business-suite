{% extends "invoices/base.html" %}
{% load currency %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="abs-card border-warning">
                <div class="abs-card-header bg-warning text-dark fw-bold">
                    <i class="fas fa-undo me-2"></i>Confirm Payment Refund
                </div>
                <div class="abs-card-body p-4">
                    <p class="mb-3">Are you sure you want to refund payment <strong>{{ payment.receipt_number }}</strong> of <strong>{{ payment.amount|naira }}</strong>?</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Reason for Refund</label>
                            <textarea name="reason" class="form-control" rows="3" placeholder="Provide reason for refunding this payment..."></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'payment_detail' payment.pk %}" class="btn btn-light">Cancel</a>
                            <button type="submit" class="btn btn-warning fw-bold text-dark">Refund Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
