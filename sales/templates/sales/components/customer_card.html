<div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">Customer Information</h5>
            <a href="{% url 'customer_create' %}" class="btn btn-primary btn-sm">
                + New Customer
            </a>
        </div>
    </div>

    <div class="card-body p-4">
        <div class="row">
            <div class="col-md-8">
                <label class="form-label fw-semibold">Customer</label>
                {{ form.customer }}
            </div>

            <div class="col-md-4">
                <label class="form-label fw-semibold">Phone</label>
                <input id="customer-phone" class="form-control" readonly placeholder="Auto-populated">
            </div>
        </div>

        <div class="mt-3">
            <label class="form-label fw-semibold">Address</label>
            <textarea id="customer-address" class="form-control" rows="2" readonly placeholder="Auto-populated"></textarea>
        </div>
    </div>
</div>
