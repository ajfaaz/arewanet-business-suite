<div class="card shadow-sm border-0">

Invoice Summary

</div>

<div class="card-body p-3">

<table class="table table-sm align-middle mb-0">

<tr>

<td class="text-muted">Subtotal</td>

<td class="text-end fw-semibold">
₦{{ invoice.subtotal }}
</td>

</tr>

<tr>

</table>

</div>

</div>
