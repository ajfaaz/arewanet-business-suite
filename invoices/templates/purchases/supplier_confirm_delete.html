{% extends 'invoices/base.html' %}

{% block title %}{{ title }} | ArewaNet ABS{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card border-0 shadow-sm rounded-4 text-center p-4">
                <div class="p-3 bg-danger bg-opacity-10 text-danger rounded-circle d-inline-block mx-auto mb-3" style="width: 70px; height: 70px;">
                    <i class="fas fa-exclamation-triangle fs-2 mt-2"></i>
                </div>
                <h3 class="fw-bold mb-2">Deactivate Supplier?</h3>
                <p class="text-muted mb-4">Are you sure you want to deactivate <strong>{{ supplier.company_name }}</strong> ({{ supplier.code }})?</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'supplier_list' %}" class="btn btn-outline-secondary px-4 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold">Deactivate Supplier</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
