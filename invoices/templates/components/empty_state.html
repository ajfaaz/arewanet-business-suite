<div class="text-center py-5">

    <i class="{{ icon|default:'fas fa-box-open' }} fa-4x text-muted mb-3"></i>

    <h4>
        {{ title }}
    </h4>

    <p class="text-muted">
        {{ message }}
    </p>

    {% if button_url %}
    <a href="{{ button_url }}" class="btn btn-primary mt-2">
        <i class="fas fa-plus me-1"></i>
        {{ button_text|default:"Add New" }}
    </a>
    {% endif %}

</div>
