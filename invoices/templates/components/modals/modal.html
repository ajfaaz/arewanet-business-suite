<div class="modal fade" id="{{ id|default:'absModal' }}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow" style="border-radius: var(--radius-lg, 16px);">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold text-dark">{{ title|default:"Confirmation" }}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body py-3">
                <p class="text-muted mb-0">{{ body_text|default:"Are you sure you want to proceed with this action?" }}</p>
            </div>
            <div class="modal-footer border-top-0 pt-0">
                <button type="button" class="btn btn-light rounded-3 px-3" data-bs-dismiss="modal">Cancel</button>
                <a href="{{ confirm_url|default:'#' }}" class="btn btn-{{ confirm_type|default:'danger' }} rounded-3 px-4">{{ confirm_text|default:"Confirm" }}</a>
            </div>
        </div>
    </div>
</div>
