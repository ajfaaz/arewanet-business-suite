<div class="abs-card">
    <div class="abs-card-header">
        Quick Actions
    </div>
    <div class="abs-card-body d-grid gap-2">
        <button type="submit" class="abs-btn abs-btn-success">Save Draft</button>
        <a href="{{ preview_url|default:'#' }}" class="abs-btn abs-btn-primary">Preview PDF</a>
        <a href="{{ print_url|default:'#' }}" class="abs-btn abs-btn-outline" target="_blank">Print</a>
        <button type="button" class="abs-btn abs-btn-outline">Email Invoice</button>
        <button type="button" class="abs-btn abs-btn-outline">Share Link</button>
    </div>
</div>
