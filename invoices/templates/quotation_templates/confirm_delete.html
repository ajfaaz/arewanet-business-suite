{% extends 'invoices/base.html' %}

{% block content %}
<div class="container p-4" style="max-width: 540px;">
    <div class="card shadow-sm border-0 rounded-3 text-center p-4">
        <div class="card-body">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill fs-1"></i>
            </div>
            <h4 class="fw-bold text-dark mb-2">Delete Quotation Template</h4>
            <p class="text-muted mb-4">
                Are you sure you want to permanently delete <strong>"{{ template.name }}"</strong>? This action cannot be undone.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'quotation_template_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 shadow-sm">Delete Template</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
