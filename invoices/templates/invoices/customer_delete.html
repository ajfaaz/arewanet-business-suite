{% extends 'invoices/base.html' %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-danger text-white py-3">
            <h5 class="mb-0 fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Delete Customer</h5>
        </div>

        <div class="card-body p-4">
            <p class="fs-5 text-dark mb-3">
                Are you sure you want to delete <strong>{{ customer.company_name }}</strong>?
            </p>

            <div class="alert alert-warning small mb-4">
                <i class="bi bi-info-circle me-1"></i>
                This action cannot be undone. Associated invoices for this customer will also be deleted.
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'customer_list' %}" class="btn btn-secondary px-4">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-danger px-4 fw-bold">
                        Confirm Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
