<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArewaNet Invoice</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'invoices/css/style.css' %}">

    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            min-height: 100vh;
            background-color: #0F3F62;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.08);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .sidebar-brand {
            padding: 24px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar .nav-link {
            color: #d1d5db;
            padding: 12px 24px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #0284c7;
        }

        .main-content {
            margin-left: 260px;
            padding: 40px;
            min-height: 100vh;
        }
    </style>
</head>

<body>

    <div class="d-flex">
        <!-- Sidebar Navigation Drawer -->
        <aside class="sidebar d-flex flex-column">
            <div class="sidebar-brand">
                <i class="bi bi-wallet2 text-info me-2"></i>ArewaNet Invoice
            </div>

            <ul class="nav flex-column mt-3 flex-grow-1">
                <li class="nav-item">
                    <a href="{% url 'dashboard' %}"
                        class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'invoice_list' %}"
                        class="nav-link {% if 'invoice' in request.resolver_match.url_name and 'payment' not in request.resolver_match.url_name %}active{% endif %}">
                        <i class="bi bi-file-earmark-text"></i> Invoices
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'payment_list' %}"
                        class="nav-link {% if 'payment' in request.resolver_match.url_name or 'receipt' in request.resolver_match.url_name %}active{% endif %}">
                        <i class="bi bi-cash-stack"></i> Payments
                    </a>
                </li>
                <!-- PRODUCTS -->
                <li class="nav-item mt-3">
                    <small class="text-uppercase text-muted px-3">
                        Inventory
                    </small>
                </li>

                <li class="nav-item">
                    <a href="{% url 'product_list' %}" class="nav-link {% if 'product' in request.resolver_match.url_name %}active{% endif %}">
                        <i class="fas fa-box"></i>
                        Products & Services
                    </a>
                </li>

                <li class="nav-item">
                    <a href="{% url 'category_list' %}" class="nav-link {% if 'category' in request.resolver_match.url_name %}active{% endif %}">
                        <i class="fas fa-tags"></i>
                        Categories
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'customer_list' %}"
                        class="nav-link {% if 'customer' in request.resolver_match.url_name %}active{% endif %}">
                        <i class="bi bi-people"></i> Customers
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/admin/" class="nav-link" target="_blank">
                        <i class="bi bi-gear"></i> Settings
                    </a>
                </li>
            </ul>

            <!-- Sidebar User Profile Panel -->
            <div class="p-3 border-top border-secondary small text-white-50">
                <span class="d-block text-white fw-bold">{{ request.user.username|default:"Admin Panel" }}</span>
                <span class="text-xs">ArewaNet Ventures</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content flex-grow-1">
            <div class="container-fluid p-0">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'invoices/js/invoice.js' %}"></script>
</body>

</html>
