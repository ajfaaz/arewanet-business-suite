{% extends 'invoices/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-3">
            <div class="card-header bg-danger text-white py-3">
                <h5 class="mb-0 fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Delete Invoice</h5>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5 text-dark">Are you sure you want to delete invoice <strong>{{ invoice.invoice_no }}</strong>?</p>
                <p class="text-muted small mb-4">This action cannot be undone. All billing items associated with this invoice will be removed permanently.</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'invoice_detail' invoice.id %}" class="btn btn-secondary px-4 fw-semibold">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger px-4 fw-semibold shadow-sm">
                            Confirm Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
